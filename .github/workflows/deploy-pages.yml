# 이 저장소를 GitHub Pages로 배포합니다.
# 브랜치에 push하면 자동으로 https://nwnubigo.github.io/cde_ai_edu/ 에 반영됩니다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/small-business-ai-education-homepage-avxfkn]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Pages가 아직 켜져 있지 않으면 켭니다.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # 빌드 과정 없는 정적 사이트라 저장소 전체를 그대로 올립니다.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - id: deployment
        uses: actions/deploy-pages@v4
